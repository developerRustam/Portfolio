<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Рустам Ганиев — Frontend-разработчик React и TypeScript с более чем четырьмя годами коммерческого опыта."
    />
    <meta name="theme-color" content="#fbfcfb" />
    <script>
      (() => {
        const key = "portfolio-theme";
        let stored = null;
        try {
          stored = localStorage.getItem(key);
        } catch {
          stored = null;
        }
        const theme =
          stored === "light" || stored === "dark"
            ? stored
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#101412" : "#fbfcfb");
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23087f70'/><text x='32' y='44' text-anchor='middle' font-size='38' fill='white'>R</text></svg>" />
    <title>Рустам Ганиев — Frontend Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Для просмотра портфолио необходимо включить JavaScript.</noscript>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
